<!DOCTYPE html>

<body>

            <button id="menu-share-set-link" type="button">Share Set as Link</button>
            <button id="menu-share-set-file" type="button">Share Set as File</button>
            <button id="menu-import-library" type="button">Import Bundle</button>
            <button id="menu-export-library" type="button">Export Bundle</button>
        </div>
        <div class="menu-section">

        <div class="menu-section menu-contact">

        <div id="ios-menu-content">
            <div class="menu-section">
                <div class="menu-section-title">Set</div>
                <button id="ios-menu-add-songs-to-set" type="button">Add Songs to Set</button>
                <button id="ios-menu-new-set" type="button">New Set</button>
                <button id="ios-menu-load-set" type="button">Load Set</button>
                <button id="ios-menu-save-set" type="button">Save Set</button>
            </div>
            <div class="menu-section">
                <div class="menu-section-title">Library</div>
                <button id="ios-menu-manage-libraries" type="button">Manage Libraries</button>
                <button id="ios-menu-add-songs" type="button">Add Songs to Library</button>
                <button id="ios-menu-delete-songs" type="button">Delete Songs from Library</button>
            </div>
            <div class="menu-section">
                <div class="menu-section-title">Import/Export</div>
                <button id="ios-menu-import-set" type="button">Import Set</button>
                <button id="ios-menu-share-set-link" type="button">Share Set as Link</button>
                <button id="ios-menu-share-set-file" type="button">Share Set as File</button>
                <button id="ios-menu-import-library" type="button">Import Bundle</button>
                <button id="ios-menu-export-library" type="button">Export Bundle</button>

            <div class="menu-section">

            </div>
            <div class="menu-section menu-contact">
                <a href="help.html" id="ios-menu-songs-help">Songs &amp; Help</a>
            </div>
            <div class="menu-section menu-contact">
                <a href="#" id="ios-menu-check-update">Check for Update</a>
            </div>
        </div>

    <main>
        <section id="controls">

                <div id="song-order-expanded" class="hidden">
                    <div id="song-order-header">
                        <span>Reorder songs</span>
                        <button id="song-order-done-btn" type="button">Done</button>
                    </div>
                    <ul id="song-reorder-list"></ul>
                </div>
            </div>

            <div id="song-meta-row">
                <div id="current-song-title"></div>
                <div id="current-song-key"></div>
                <div id="font-size-controls" class="font-size-controls">
                    <button id="font-decrease-btn" type="button" title="Smaller text">A-</button>
                    <button id="font-increase-btn" type="button" title="Larger text">A+</button>
                </div>
                <div id="song-btn-row"></div>
            </div>
        </section>

        <div id="sticky-nav-row">
            <div id="nav-buttons">
                <button id="prev-btn" disabled>Prev Song</button>
                <button id="next-btn" disabled>Next Song</button>
            </div>
            <button id="autoscroll-btn">Scroll</button>
            <div id="section-jumps"></div>
        </div>
        <div id="edit-tip" class="edit-tip hidden">Click chord / lyric to edit; click section headings to add comments</div>

        <section id="song-view"></section>
    </main>

    <!-- Library browser modal -->
    <div id="library-modal" class="hidden">
        <div id="library-modal-overlay"></div>
        <div id="library-modal-panel">
            <div id="library-modal-header">
                <span>Song Library</span>
                <button id="library-modal-close" type="button">✕</button>
            </div>
            <div id="library-song-list"></div>
            <div id="library-modal-actions">
                <button id="library-add-selected" type="button">Add selected</button>
            </div>
        </div>
    </div>

    <!-- Load set modal -->
    <div id="loadset-modal" class="hidden">
        <div id="loadset-modal-overlay"></div>
        <div id="loadset-modal-panel">
            <div id="loadset-modal-header">
                <span>Saved Sets</span>
                <button id="loadset-modal-close" type="button">✕</button>
            </div>
            <div id="loadset-list"></div>
        </div>
    </div>

    <!-- Save set modal -->
    <div id="saveset-modal" class="hidden">
        <div id="saveset-modal-overlay"></div>
        <div id="saveset-modal-panel">
            <div id="saveset-modal-header">
                <span>Save Set</span>
                <button id="saveset-modal-close" type="button">✕</button>
            </div>
            <div id="saveset-form">
                <input type="text" id="saveset-name" placeholder="Set name...">
                <button id="saveset-confirm" type="button">Save</button>
            </div>
        </div>
    </div>

    <!-- Manage libraries modal -->
    <div id="manage-libraries-modal" class="hidden">
        <div id="manage-libraries-modal-overlay"></div>
        <div id="manage-libraries-modal-panel">
            <div id="manage-libraries-modal-header">
                <span>Manage Libraries</span>
                <button id="manage-libraries-modal-close" type="button">✕</button>
            </div>
            <div id="manage-libraries-form">
                <div id="manage-libraries-add-row">
                    <input type="text" id="manage-libraries-new-name" placeholder="New library name..." maxlength="17">
                    <button id="manage-libraries-add" type="button">+</button>
                </div>
            </div>
            <div id="manage-libraries-list"></div>
        </div>
    </div>

    <script type="module" src="app.js?v=20260501T4"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js');
        }

        // Non-module fallback only: used when app.js fails on older browsers/devices.
        (function() {
            const menuBtn = document.getElementById('menu-btn');
            const menuPanel = document.getElementById('menu-panel');
            const menuOverlay = document.getElementById('menu-overlay');
            const iosFallback = document.getElementById('ios-menu-fallback');
            const closeBtn = document.getElementById('ios-menu-close-btn');
            const navMenuClose = document.getElementById('menu-close-btn');
            const navMenuOverlay = document.getElementById('menu-overlay');
            const fileInput = document.getElementById('file-input');
            const importLibraryInput = document.getElementById('import-library-input');
            const importSetInput = document.getElementById('import-set-input');

            const userAgent = navigator.userAgent;
            const isIpadOSDesktopUA = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
            const isSafariEngine = /Safari/.test(userAgent) && !/Chrome|CriOS|FxiOS|EdgiOS/.test(userAgent);
            const safariVersionMatch = userAgent.match(/Version\/(\d+)\./);
            const safariMajorVersion = safariVersionMatch ? parseInt(safariVersionMatch[1], 10) : null;
            const isMacLikeSafari15 = /Macintosh/.test(userAgent) && isSafariEngine && safariMajorVersion === 15;
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) || isIpadOSDesktopUA || isMacLikeSafari15;
            const iOSMatch = userAgent.match(/OS (\d+)_/);
            const iOSVersion = iOSMatch ? parseInt(iOSMatch[1], 10) : null;
            const needsFallback = isIOS && (iOSVersion === null || iOSVersion <= 15 || isMacLikeSafari15);

            function appReady() {
                return !!window.__stagechordAppReady;
            }

            function closeMenus() {
                if (iosFallback) iosFallback.classList.add('hidden');
                if (menuPanel) menuPanel.classList.add('hidden');
                if (menuOverlay) menuOverlay.classList.add('hidden');
            }

            // Minimal IndexedDB fallback so imports still work when app module fails.
            const FALLBACK_DB_NAME = 'stagechord';
            const FALLBACK_DB_VERSION = 2;
            const FALLBACK_DEFAULT_LIBRARY_ID = 1;
            let fallbackDbPromise = null;

            function openFallbackDb() {
                if (fallbackDbPromise) return fallbackDbPromise;
                fallbackDbPromise = new Promise(function(resolve, reject) {
                    const req = indexedDB.open(FALLBACK_DB_NAME, FALLBACK_DB_VERSION);
                    req.onupgradeneeded = function(e) {
                        const db = e.target.result;
                        const tx = e.target.transaction;
                        if (!db.objectStoreNames.contains('songs')) {
                            const songStore = db.createObjectStore('songs', { keyPath: 'id', autoIncrement: true });
                            songStore.createIndex('filename', 'filename', { unique: false });
                            songStore.createIndex('contentHash', 'contentHash', { unique: false });
                            songStore.createIndex('libraryId', 'libraryId', { unique: false });
                            songStore.createIndex('libraryContentHash', ['libraryId', 'contentHash'], { unique: false });
                        } else {
                            const songStore = tx.objectStore('songs');
                            if (!songStore.indexNames.contains('libraryId')) {
                                songStore.createIndex('libraryId', 'libraryId', { unique: false });
                            }
                            if (!songStore.indexNames.contains('libraryContentHash')) {
                                songStore.createIndex('libraryContentHash', ['libraryId', 'contentHash'], { unique: false });
                            }
                        }
                        if (!db.objectStoreNames.contains('songState')) {
                            const stateStore = db.createObjectStore('songState', { keyPath: 'songId' });
                            stateStore.createIndex('songId', 'songId', { unique: true });
                        }
                        if (!db.objectStoreNames.contains('setlists')) {
                            const setStore = db.createObjectStore('setlists', { keyPath: 'id', autoIncrement: true });
                            setStore.createIndex('libraryId', 'libraryId', { unique: false });
                        } else {
                            const setStore = tx.objectStore('setlists');
                            if (!setStore.indexNames.contains('libraryId')) {
                                setStore.createIndex('libraryId', 'libraryId', { unique: false });
                            }
                        }
                        if (!db.objectStoreNames.contains('libraries')) {
                            const libStore = db.createObjectStore('libraries', { keyPath: 'id', autoIncrement: true });
                            libStore.createIndex('lowerName', 'lowerName', { unique: true });
                            libStore.createIndex('isDefault', 'isDefault', { unique: false });
                        }

                        if (e.oldVersion < 2) {
                            const libStore = tx.objectStore('libraries');
                            libStore.put({
                                id: FALLBACK_DEFAULT_LIBRARY_ID,
                                name: 'Default',
                                lowerName: 'default',
                                isDefault: true,
                                createdAt: Date.now()
                            });

                            const songStore = tx.objectStore('songs');
                            songStore.openCursor().onsuccess = function(evt) {
                                const cursor = evt.target.result;
                                if (!cursor) return;
                                const row = cursor.value;
                                if (!row.libraryId) {
                                    row.libraryId = FALLBACK_DEFAULT_LIBRARY_ID;
                                    cursor.update(row);
                                }
                                cursor.continue();
                            };

                            const setStore = tx.objectStore('setlists');
                            setStore.openCursor().onsuccess = function(evt) {
                                const cursor = evt.target.result;
                                if (!cursor) return;
                                const row = cursor.value;
                                if (!row.libraryId) {
                                    row.libraryId = FALLBACK_DEFAULT_LIBRARY_ID;
                                    cursor.update(row);
                                }
                                cursor.continue();
                            };
                        }
                    };
                    req.onsuccess = function() { resolve(req.result); };
                    req.onerror = function() { reject(req.error); };
                });
                return fallbackDbPromise;
            }

            function hashText(text) {
                let h1 = 0xdeadbeef;
                let h2 = 0x41c6ce57;
                for (let i = 0; i < text.length; i++) {
                    const ch = text.charCodeAt(i);
                    h1 = Math.imul(h1 ^ ch, 2654435761);
                    h2 = Math.imul(h2 ^ ch, 1597334677);
                }
                h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
                h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
                return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
            }

            async function addSongFallback(filename, originalText, libraryId) {
                const db = await openFallbackDb();
                const hash = hashText(originalText);
                const targetLibraryId = libraryId || FALLBACK_DEFAULT_LIBRARY_ID;
                const existing = await new Promise(function(resolve, reject) {
                    const tx = db.transaction('songs', 'readonly');
                    const idx = tx.objectStore('songs').index('libraryContentHash');
                    const req = idx.getAll([targetLibraryId, hash]);
                    req.onsuccess = function() { resolve(req.result); };
                    req.onerror = function() { reject(req.error); };
                });
                if (existing.length > 0) return existing[0].id;
                return new Promise(function(resolve, reject) {
                    const tx = db.transaction('songs', 'readwrite');
                    const req = tx.objectStore('songs').add({
                        libraryId: targetLibraryId,
                        filename: filename,
                        originalText: originalText,
                        contentHash: hash,
                        importedAt: Date.now()
                    });
                    req.onsuccess = function() { resolve(req.result); };
                    req.onerror = function() { reject(req.error); };
                });
            }

            async function saveSongStateFallback(songId, state) {
                const db = await openFallbackDb();
                return new Promise(function(resolve, reject) {
                    const tx = db.transaction('songState', 'readwrite');
                    tx.objectStore('songState').put({
                        songId: songId,
                        transpose: state.transpose || 0,
                        annotation: state.annotation || '',
                        stave: state.stave || null,
                        staveTimeSig: state.staveTimeSig || null,
                        editedText: state.editedText || null,
                        updatedAt: Date.now()
                    });
                    tx.oncomplete = function() { resolve(); };
                    tx.onerror = function() { reject(tx.error); };
                });
            }

            async function importLibraryFallback(data, libraryId) {
                var songs = null;
                if (Array.isArray(data)) {
                    songs = data;
                } else if (data && Array.isArray(data.songs)) {
                    songs = data.songs;
                } else if (data && data.bundle && Array.isArray(data.bundle.songs)) {
                    songs = data.bundle.songs;
                }
                if (!songs) {
                    throw new Error('Invalid bundle file: expected a songs array');
                }

                let imported = 0;
                for (let i = 0; i < songs.length; i++) {
                    const entry = songs[i];
                    if (!entry) continue;
                    const filename = entry.filename || entry.name || 'Imported Song.chopro';
                    const originalText = entry.originalText || entry.text || null;
                    if (!originalText) continue;
                    const id = await addSongFallback(filename, originalText, libraryId);
                    if (entry.state) {
                        await saveSongStateFallback(id, entry.state);
                    }
                    imported++;
                }
                return imported;
            }

            async function importSetFallback(data) {
                if (!data || data.type !== 'setlist' || !Array.isArray(data.songs)) {
                    throw new Error('Invalid set file');
                }
                const db = await openFallbackDb();
                const songIds = [];
                for (let i = 0; i < data.songs.length; i++) {
                    const entry = data.songs[i];
                    if (!entry || !entry.filename || !entry.originalText) continue;
                    const id = await addSongFallback(entry.filename, entry.originalText);
                    if (entry.state) {
                        await saveSongStateFallback(id, entry.state);
                    }
                    songIds.push(id);
                }
                await new Promise(function(resolve, reject) {
                    const tx = db.transaction('setlists', 'readwrite');
                    tx.objectStore('setlists').add({
                        name: data.name || 'Imported Set',
                        libraryId: FALLBACK_DEFAULT_LIBRARY_ID,
                        songIds: songIds,
                        currentIndex: 0,
                        createdAt: Date.now()
                    });
                    tx.oncomplete = function() { resolve(); };
                    tx.onerror = function() { reject(tx.error); };
                });
                return songIds.length;
            }

            async function handleAddSongsFallback() {
                const files = Array.from((fileInput && fileInput.files) || []);
                if (files.length === 0) return;
                let imported = 0;
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const text = await file.text();
                    if (!text) continue;
                    await addSongFallback(file.name, text);
                    imported++;
                }
                fileInput.value = '';
                alert('Imported ' + imported + ' song(s) into your library.');
            }

            async function handleImportLibraryFileFallback() {
                const file = importLibraryInput && importLibraryInput.files && importLibraryInput.files[0];
                if (!file) return;
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    const count = await importLibraryFallback(data);
                    alert('Imported ' + count + ' song(s) into your library.');
                } catch (e) {
                    alert('Failed to import library: ' + (e && e.message ? e.message : e));
                }
                importLibraryInput.value = '';
            }

            async function handleImportSetFileFallback() {
                const file = importSetInput && importSetInput.files && importSetInput.files[0];
                if (!file) return;
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    const count = await importSetFallback(data);
                    alert('Imported set with ' + count + ' song(s).');
                } catch (e) {
                    alert('Failed to import set: ' + (e && e.message ? e.message : e));
                }
                importSetInput.value = '';
            }

            async function importPendingLibraryFallback() {
                const libUrl = localStorage.getItem('stagechord_pending_import');
                if (!libUrl) return;
                localStorage.removeItem('stagechord_pending_import');
                const rawLibraryId = localStorage.getItem('stagechord_pending_import_library_id');
                let targetLibraryId = FALLBACK_DEFAULT_LIBRARY_ID;
                if (rawLibraryId) {
                    localStorage.removeItem('stagechord_pending_import_library_id');
                    const parsedLibraryId = Number.parseInt(rawLibraryId, 10);
                    if (Number.isFinite(parsedLibraryId) && parsedLibraryId > 0) {
                        targetLibraryId = parsedLibraryId;
                    }
                }
                try {
                    const resp = await fetch(libUrl);
                    if (!resp.ok) throw new Error('Could not fetch bundle file');
                    const data = await resp.json();
                    const count = await importLibraryFallback(data, targetLibraryId);
                    alert('Imported ' + count + ' song(s) from Songs & Help.');
                } catch (e) {
                    alert('Failed to import Songs & Help bundle: ' + (e && e.message ? e.message : e));
                }
            }

            if (menuBtn) {
                menuBtn.addEventListener('click', function(e) {
                    if (appReady()) return;
                    e.preventDefault();
                    e.stopPropagation();
                    if (needsFallback && iosFallback) {
                        iosFallback.classList.toggle('hidden');
                    } else if (menuPanel && menuOverlay) {
                        menuPanel.classList.toggle('hidden');
                        menuOverlay.classList.toggle('hidden');
                    }
                }, false);
            }

            if (closeBtn) closeBtn.addEventListener('click', closeMenus);
            if (navMenuClose) navMenuClose.addEventListener('click', closeMenus);
            if (navMenuOverlay) navMenuOverlay.addEventListener('click', closeMenus);

            function unsupportedAction() {
                alert('This action needs full app support, which did not load on this device/browser.');
            }

            const actionIds = [
                'menu-new-set', 'ios-menu-new-set',
                'menu-add-songs-to-set', 'ios-menu-add-songs-to-set',
                'menu-load-set', 'ios-menu-load-set',
                'menu-save-set', 'ios-menu-save-set',
                'menu-share-set-link', 'ios-menu-share-set-link',
                'menu-share-set-file', 'ios-menu-share-set-file',
                'menu-manage-libraries', 'ios-menu-manage-libraries',
                'menu-delete-songs', 'ios-menu-delete-songs',
                'menu-export-library', 'ios-menu-export-library',
                'menu-check-update', 'ios-menu-check-update'
            ];

            const importIds = {
                'menu-add-songs': fileInput,
                'ios-menu-add-songs': fileInput,
                'menu-import-library': importLibraryInput,
                'ios-menu-import-library': importLibraryInput,
                'menu-import-set': importSetInput,
                'ios-menu-import-set': importSetInput
            };

            Object.entries(importIds).forEach(function(entry) {
                const btn = document.getElementById(entry[0]);
                const input = entry[1];
                if (!btn) return;
                btn.addEventListener('click', function(e) {
                    if (appReady()) return;
                    e.preventDefault();
                    if (input) input.click();
                    closeMenus();
                });
            });

            if (fileInput) {
                fileInput.addEventListener('change', function() {
                    if (appReady()) return;
                    handleAddSongsFallback();
                });
            }
            if (importLibraryInput) {
                importLibraryInput.addEventListener('change', function() {
                    if (appReady()) return;
                    handleImportLibraryFileFallback();
                });
            }
            if (importSetInput) {
                importSetInput.addEventListener('change', function() {
                    if (appReady()) return;
                    handleImportSetFileFallback();
                });
            }

            actionIds.forEach(function(id) {
                const btn = document.getElementById(id);
                if (!btn) return;
                btn.addEventListener('click', function(e) {
                    if (appReady()) return;
                    e.preventDefault();
                    unsupportedAction();
                    closeMenus();
                });
            });

            const installIds = ['menu-install-app', 'ios-menu-install-app'];
            installIds.forEach(function(id) {
                const btn = document.getElementById(id);
                if (!btn) return;
                btn.addEventListener('click', function(e) {
                    if (appReady()) return;
                    e.preventDefault();
                    alert('To install StageChord:\n\niOS (Apple): Tap the Share button (⬆) then "Add to Home Screen"\n\nAndroid: Tap the browser menu (⋮) then "Add to Home screen"');
                    closeMenus();
                });
            });

            window.addEventListener('load', function() {
                if (!appReady()) {
                    importPendingLibraryFallback();
                }
            });
        })();
    </script>
</body>
</html>
